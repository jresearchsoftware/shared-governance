name: Public candidate checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source, active protocol and exact-commit flow export
        run: python3 scripts/qualify.py --export-ref HEAD
      - name: Check passive distribution preparation and integrity failures
        run: python3 scripts/test-distribution.py
      - name: Check candidate whitespace
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ]; then
            git diff --check "$base" HEAD
          else
            git show --format= --check HEAD
          fi
