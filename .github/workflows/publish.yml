name: Publish accepted package

on:
  workflow_run:
    workflows: [Public candidate checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full accepted source main SHA to retry (same revision as the failed run)
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Each accepted SHA retains its own run; a global concurrency group can discard
# pending releases. Races at the destination fail atomically and can be retried.
concurrency:
  group: package-publication-${{ github.event.workflow_run.head_sha || inputs.source_sha }}
  cancel-in-progress: false

jobs:
  readiness:
    if: >-
      github.repository == 'jresearchsoftware/shared-governance' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jresearchsoftware/shared-governance
          ref: 5a1e5de66388501235fc9ffd23d45efb34df2b85
          path: publisher
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source-bound producer readiness without distribution credentials
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 producer/scripts/check-publication.py --publisher publisher --source-sha "$SOURCE_SHA"
      - name: Qualify the exact changed accepted payload
        if: steps.readiness.outputs.changed == 'true'
        working-directory: producer
        run: python3 scripts/qualify.py --export-ref HEAD
      - name: Same-source recovery
        if: failure()
        run: |
          printf 'Producer readiness failed or pending for source `%s`. Retry this same SHA using Publish accepted package after recovery.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: readiness
    uses: jresearchsoftware/shared-governance/.github/workflows/vibe-publisher.yml@5a1e5de66388501235fc9ffd23d45efb34df2b85
    with:
      mode: publish
      source_sha: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
      binding: vibe-publisher.json
      package: org.jresearch.ai/development-governance
    secrets:
      publish_token: ${{ secrets.DEVELOPMENT_GOVERNANCE_PUBLISH_TOKEN }}
